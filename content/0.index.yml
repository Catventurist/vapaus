title: Enjoy [Vapaus]{class="text-primary"} to the [Fullest]{class="text-info"}
description: Information about freedom.
seo:
  title: Vapaus
  description: Information about freedom.
navigation: false
hero:
  links:
    - label: Get started
      icon: i-lucide-arrow-right
      trailing: true
      to: /docs/getting-started/installation
      size: xl
      variant: soft
    - label: Git
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: subtle
      to: https://github.com/catventurist
      target: _blank
sections:
  - title: Built with Passion
    description: Using knowledge on how things work to build something new. Following the latest technological andvances and implementing them in code.
    id: features
    orientation: horizontal
    features:
      - name: FOSS
        description: Free and Open Source, a good base to build on top of.
        icon: i-lucide-code-2
      - name: Documentation
        description: Guides on how to use the interface and add or modify content.
        icon: i-lucide-book-open
        to: /docs/getting-started/installation
      - name: Decentralization
        description: Saving data on censorship-free databases and organize without middlemen.
        icon: i-lucide-package
  - title: Trustworthy Technology
    description: Relying on things, which have worked well for many years.
    orientation: horizontal
    reverse: true
    features:
      - name: Something for Everyone
        description: From simple sites to decentralized apps, big possibilities.
        icon: i-lucide-zap
      - name: Direct Contact
        description: Person to person information exchange through digital tools.
        icon: i-lucide-message-square
      - name: Global and Local
        description: Decentralized solutions are available worldwide to organize locally.
        icon: i-lucide-globe
features:
  title: Examples of living outside the norms
  description: A hint of luck, a lot of knowledge and some communication skills.
  items:
    - title: Beautiful World
      description: Various sceneries, amazing animals, pretty plants and more outside the virtual realities.
      icon: i-lucide-palette
    - title: Great Feeling
      description: No limits aside from morals and the physical body results in a light heart.
      icon: i-lucide-bath
    - title: Unique Experiences
      description: Without plans and tiny trust on life gives stories to tell in the old age.
      icon: i-lucide-bird
    - title: Emotional Intelligence
      description: Coding is very logical, so need human connections to balance the brain.
      icon: i-lucide-heart
    - title: Always Ready
      description: When something interesting comes up, just learn and make it with your own spice.
      icon: i-lucide-check-circle
    - title: Artificial Scarcity
      description: Price tags are made to fool people thinking they represent real value.
      icon: i-lucide-fingerprint
testimonials:
  headline: Memes
  title: Snippets of Information
  description: Creates an opportunity to think outside the box.
  items:
    - quote: You never change things by fighting the existing reality. To change something, build a new model that makes the existing model obsolete.
      user:
        name: Buckminister Fuller
        description: Designer
        avatar:
          src: /cat.png
    - quote: The imagination is the golden pathway to everywhere.
      user:
        name: Terence McKenna
        description: Author
        avatar:
          src: /cat.png
    - quote: Chaga is one of the weirdest mushrooms you may ever see. A fungal parasite found on birch trees, Chaga is a hardened, blackened, crusty formation that looks like a bursting tumor.
      user:
        name: Paul Stamets
        description: Master of Mycology
        avatar:
          src: /cat.png
    - quote: When I am sharply judgmental of any other person, it is because I sense or see reflected in them some aspect of myself that I don not want to acknowledge.
      user:
        name: Gabor Maté
        description: Researcher
        avatar:
          src: /cat.png
    - quote: No valid plans for the future can be made by those who have no capacity for living now.
      user:
        name: Alan Watts
        description: Thinker
        avatar:
          src: /cat.png
    - quote: Truth cannot be given to you by somebody. You have to discover it. And to discover, there must be a state of mind, in which there is direct perception.
      user:
        name: Jiddu Krishnamurti
        description: Speaker
        avatar:
          src: /cat.png
cta:
  title: Ready for Vapaus?
  description: Copy the whole thing or join in the development.
  links:
    - label: Start Learning
      to: '/docs/getting-started/installation'
      target: _blank
      trailingIcon: i-lucide-arrow-right
      variant: soft
    - label: View on GitHub
      to: 'https://github.com/catventurist'
      target: _blank
      variant: subtle
      icon: i-simple-icons-github
