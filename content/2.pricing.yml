title: Something for Everyone
description: The plans are based on Morals, and the shown currency is in BTC divided in satoshis.
seo:
  title: Pricing
  description: Choose the plan, that sounds right.
navigation.icon: i-lucide-bitcoin
plans:
  - title: Basic
    description: A plan for good people and communities. 
    price:
      month: 0 s
      year: 0 s
    button:
      label: Get Started
      color: neutral
      variant: subtle
    features:
      - 2 Storage options
      - 1 App
      - 1 Database
      - Support
  - title: Standard
    description: For small organizations.
    price:
      month: 9 s
      year: 90 s
    highlight: true
    scale: true
    button:
      label: Read more
      to: '#faq'
    features:
      - 10 Storage options
      - 10 Accounts
      - 10 Apps
      - 10 Databases
      - Support
  - title: Premium
    description: For Companies.
    price:
      month: 100 s
      year: 1000 s
    button:
      label: Contact us
      color: neutral
      variant: subtle
      to: /
    features:
      - 100 Storage options
      - 100 Accounts
      - 100 Apps
      - 100 Databases
      - Support
logos:
  title: Using the latest tools
  icons:
    - i-simple-icons-hive-blockchain
    - i-simple-icons-nuxt
    - i-simple-icons-tailwindcss
    - i-simple-icons-typescript
    - i-simple-icons-cloudflare
faq:
  title: Frequently asked questions
  description: Things about the monetary exchanges and contracts.
  items:
    - label: Is this secure?
      content: Using the updated libraries and reading on new tech exploits makes this app quite hard to put down.
    - label: How can I cancel my subscription?
      content: Contact and we will work it out.
    - label: How does freedom work?
      content: Personal responsibility and following the Golden Rule.
    - label: Can I switch plans later?
      content: Sure. Everything is negotiable
    - label: Do you offer refunds?
      content: Money is not an issue, naturally.
    - label: Do you offer support?
      content: Always can ask, the answer is based on current knowledge.
