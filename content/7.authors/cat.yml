faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            I specialize in UX/UI design and front-end development. Creating intuitive user interfaces, building responsive websites and web applications (especially with Vue.js/Nuxt.js). My goal is to create different experiences, from virtual to real life.
        - label: What is your thought process like?
          content: |
           Notice a thing to improve, think on it and make it happen. Close collaboration is important to keep motives high  with development teams during implementation. Starting on project needs, available resources and then introduce them.
        - label: Do you work with companies?
          content: |
            I enjoy working with people who have good values, which can be distorted with falsified information and money, or actual resources. Organizing code is a lot similar with communities, both the favorite things to do.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project cost?
          content: |
            Project costs vary based on purpose, scope, complexity, features, and timeline. Project needs to service a real purpose, the values goes first. Can start around 0.04BTC, with average projects ranging between 0.07BTC and 0.25BTC. For consulting or specific design tasks, my day rate is 0.007BTC.
        - label: What are your payment terms?
          content: |
            I generally require a 40% deposit to schedule the project and begin work, with the remaining 60% due upon successful project completion and delivery. I accept payments with Cryptocurrencies, like Bitcoin.
        - label: How long does a typical project take?
          content: |
            Timelines depend heavily on the project's scope and complexity. Smaller projects might take 1-2 weeks, while larger, more involved projects can range from 2 to 4 months. I always provide a detailed estimate.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes, if needing design support, feature development, or maintenance, just hit me up.
    - title: About Me
      questions:
        - label: What do you enjoy most about your coding?
          content: |
            I love solving complex problems with new technology. It's incredibly rewarding to see people interact with something I've created and find it genuinely useful and easy to navigate. Bridging the gap between user needs and technical possibilities is what truly excites me.